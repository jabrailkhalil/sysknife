---
name: Risk prose validation

on:
  push:
    branches: [validation/risk-prose-20261027]

permissions:
  contents: read

jobs:
  finish-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
      - name: Checkout exact upstream base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: lacs-project/sysknife
          ref: 24ebd624b740debfb1614327b09e281cbcb8f496
          path: source
          persist-credentials: false
      - name: Install pinned Python tools
        run: pip install --require-hashes -r tools/ci-python/requirements.txt
      - name: Reproduce both validation-environment faults on untouched main
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          test "$(git rev-parse HEAD)" = 24ebd624b740debfb1614327b09e281cbcb8f496
          set +e
          UPDATE_TEST_BASELINE=1 bash tests/release/test-baseline-provenance.test.sh > ../evidence/base-update-env.log 2>&1
          baseline_status=$?
          bash tests/release/mdbook-links.test.sh > ../evidence/base-missing-mdbook.log 2>&1
          mdbook_status=$?
          set -e
          test "$baseline_status" != 0
          grep -F 'FAIL: frontend count mismatch was accepted' ../evidence/base-update-env.log
          test "$mdbook_status" != 0
          grep -F 'mdbook and mdbook-admonish must be installed under CI' ../evidence/base-missing-mdbook.log
      - name: Install the project's pinned mdBook tools
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz
          echo '9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b /tmp/mdbook.tar.gz' | sha256sum --check --strict -
          sudo tar -xzf /tmp/mdbook.tar.gz --directory /usr/local/bin
          curl -sSfL -o /tmp/mdbook-admonish.tar.gz https://github.com/tommilligan/mdbook-admonish/releases/download/v1.18.0/mdbook-admonish-v1.18.0-x86_64-unknown-linux-gnu.tar.gz
          echo '5d19ec6376c646204235f197c91398cf95873e96e6100982137112056da96fe4 /tmp/mdbook-admonish.tar.gz' | sha256sum --check --strict -
          sudo tar -xzf /tmp/mdbook-admonish.tar.gz --directory /usr/local/bin
      - name: Verify both hygiene checks on main with normal environment
        run: |
          set -euo pipefail
          env -u UPDATE_TEST_BASELINE bash tests/release/test-baseline-provenance.test.sh 2>&1 | tee ../evidence/base-baseline-provenance.log
          env -u UPDATE_TEST_BASELINE bash tests/release/mdbook-links.test.sh 2>&1 | tee ../evidence/base-mdbook.log
      - name: Verify the unchanged tested Rust source and generated baseline
        run: |
          set -euo pipefail
          git apply --check ../harness/validation/risk-prose.patch
          git apply ../harness/validation/risk-prose.patch
          sha256sum --check ../harness/validation/expected-source.sha256
          git diff --check
          env -u UPDATE_TEST_BASELINE bash tests/release/test-baseline-provenance.test.sh 2>&1 | tee ../evidence/candidate-baseline-provenance.log
          env -u UPDATE_TEST_BASELINE bash tests/release/mdbook-links.test.sh 2>&1 | tee ../evidence/candidate-mdbook.log
      - name: Exercise the privileged action-step fixture required by CI
        run: |
          set -euo pipefail
          sudo env PATH="$PATH" bash tests/release/action-steps.test.sh 2>&1 | tee ../evidence/privileged-action-steps.log
          git diff --binary --output=../evidence/verified-source.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: risk-prose-hygiene-repair
          path: evidence/
