---
name: Risk prose baseline refresh

on:
  push:
    branches: [validation/risk-prose-20261027]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: lacs-project/sysknife
          ref: 45d5bdff66984ff4231b98ebdca5260c53022774
          path: source
          persist-credentials: false
      - name: Install canonical Rust workspace prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable (branch)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Reuse the existing remote Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: source -> ../target
          key: risk-prose-20261027
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
        with:
          tool: cargo-nextest
      - name: Apply the unchanged two-file PR patch
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          test "$(git rev-parse HEAD)" = 45d5bdff66984ff4231b98ebdca5260c53022774
          git rev-parse HEAD > ../evidence/base-sha.txt
          git apply --check ../harness/validation/risk-prose.patch
          git apply ../harness/validation/risk-prose.patch
          git diff --check
          sha256sum --check ../harness/validation/expected-source.sha256
          sha256sum crates/sysknife-brain/src/prompt.rs \
            crates/sysknife-daemon/tests/prompt_risk_labels.rs > ../evidence/source-sha256.txt
          { rustc --version; cargo --version; cargo nextest --version; } > ../evidence/toolchain.txt
      - name: Run the full workspace and regenerate the real baseline
        run: |
          set -euo pipefail
          UPDATE_TEST_BASELINE=1 bash scripts/test_baseline.sh \
            2>&1 | tee ../evidence/workspace-baseline.log
      - name: Format and Clippy on the refreshed source
        run: |
          set -euo pipefail
          cargo fmt --all --check 2>&1 | tee ../evidence/format.log
          cargo clippy --workspace --all-features --all-targets --locked -- -D warnings \
            2>&1 | tee ../evidence/clippy.log
      - name: Verify provenance, figures and scope
        run: |
          set -euo pipefail
          bash tests/release/test-baseline-provenance.test.sh \
            2>&1 | tee ../evidence/baseline-provenance.log
          python3 scripts/render_figures.py "$PWD"
          bash scripts/check_public_claims.sh
          sha256sum --check ../harness/validation/expected-source.sha256
          git diff --check
          python3 - <<'PY'
          import json, pathlib, subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'crates/sysknife-brain/src/prompt.rs',
                      'crates/sysknife-daemon/tests/prompt_risk_labels.rs',
                      'tests/evidence/workspace-tests.json'}
          assert actual == expected, actual
          baseline = json.loads(pathlib.Path('tests/evidence/workspace-tests.json').read_text())
          assert baseline['tests'] == 2093, baseline
          assert baseline['frontend_tests'] == 72, baseline
          print(json.dumps({'changed_files': sorted(actual), 'generated_baseline': baseline}))
          PY
      - name: Preserve exact generated output and tested patch
        if: always()
        run: |
          mkdir -p ../evidence/generated
          git diff --binary --output=../evidence/measured-source.patch
          git diff --name-only -z | while IFS= read -r -d '' changed; do
            mkdir -p "../evidence/generated/$(dirname "$changed")"
            cp -- "$changed" "../evidence/generated/$changed"
          done
          git status --short > ../evidence/source-status.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: risk-prose-baseline-refresh
          path: evidence/
