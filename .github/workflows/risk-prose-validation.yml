---
name: Risk prose baseline refresh

on:
  push:
    branches: [validation/risk-prose-20261027]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: lacs-project/sysknife
          ref: 25c9e76e6382966139cad7da93700644cb242ffd
          path: source
          persist-credentials: false
      - name: Install canonical Rust workspace prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable (branch)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Reuse the existing remote Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: source -> ../target
          key: risk-prose-20261027
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
        with:
          tool: cargo-nextest
      - name: Measure the unmodified current-main workspace
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          test "$(git rev-parse HEAD)" = 25c9e76e6382966139cad7da93700644cb242ffd
          UPDATE_TEST_BASELINE=1 bash scripts/test_baseline.sh \
            2>&1 | tee ../evidence/main-workspace-baseline.log
          cp tests/evidence/workspace-tests.json ../evidence/main-measured-baseline.json
          git diff --binary > ../evidence/main-generated.patch
          git restore --worktree .
          git diff --exit-code
      - name: Apply the unchanged two-file PR patch
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          test "$(git rev-parse HEAD)" = 25c9e76e6382966139cad7da93700644cb242ffd
          git rev-parse HEAD > ../evidence/base-sha.txt
          git apply --check ../harness/validation/risk-prose.patch
          git apply ../harness/validation/risk-prose.patch
          git diff --check
          sha256sum --check ../harness/validation/expected-source.sha256
          sha256sum crates/sysknife-brain/src/prompt.rs \
            crates/sysknife-daemon/tests/prompt_risk_labels.rs > ../evidence/source-sha256.txt
          { rustc --version; cargo --version; cargo nextest --version; } > ../evidence/toolchain.txt
      - name: Run the full workspace and regenerate the real baseline
        run: |
          set -euo pipefail
          UPDATE_TEST_BASELINE=1 bash scripts/test_baseline.sh \
            2>&1 | tee ../evidence/workspace-baseline.log
      - name: Format and Clippy on the refreshed source
        run: |
          set -euo pipefail
          cargo fmt --all --check 2>&1 | tee ../evidence/format.log
          cargo clippy --workspace --all-features --all-targets --locked -- -D warnings \
            2>&1 | tee ../evidence/clippy.log
      - name: Container guard and source-revert control
        run: |
          set -euo pipefail
          prompt=crates/sysknife-brain/src/prompt.rs
          cp "$prompt" ../evidence/prompt-approved.rs
          trap 'cp ../evidence/prompt-approved.rs "$prompt"' EXIT
          docker build -t sysknife-risk-guard:local -f ../harness/validation/guard.Dockerfile ../harness/validation
          docker image inspect sysknife-risk-guard:local --format '{{.Id}}' > ../evidence/guard-image.txt
          build_guard() {
            cargo test -p sysknife-daemon --test prompt_risk_labels --locked --no-run \
              --message-format=json > ../evidence/guard-build.jsonl || return $?
            python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path('../evidence/guard-build.jsonl').read_text().splitlines() if line.startswith('{')]
          paths = {event['executable'] for event in events if event.get('reason') == 'compiler-artifact' and event.get('target', {}).get('name') == 'prompt_risk_labels' and event.get('executable')}
          assert len(paths) == 1, paths
          print(Path(next(iter(paths))).resolve())
          PY
          }
          run_guard() {
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --user 65534:65534 --mount "type=bind,src=$1,dst=/guard,readonly" \
              sysknife-risk-guard:local /guard --exact prose_risk_claims_match_the_action_specs --nocapture
          }
          binary="$(build_guard)"
          run_guard "$binary" 2>&1 | tee ../evidence/container-positive.log
          git show 25c9e76e6382966139cad7da93700644cb242ffd:"$prompt" > "$prompt"
          binary="$(build_guard)"
          set +e
          run_guard "$binary" 2>&1 | tee ../evidence/container-reverted.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 101
          grep -F 'prose_risk_claims_match_the_action_specs ... FAILED' ../evidence/container-reverted.log
          grep -F 'AptAutoremove' ../evidence/container-reverted.log
          cp ../evidence/prompt-approved.rs "$prompt"
          binary="$(build_guard)"
          run_guard "$binary" 2>&1 | tee ../evidence/container-restored.log
          sha256sum --check ../harness/validation/expected-source.sha256
      - name: Verify provenance, figures and scope
        run: |
          set -euo pipefail
          bash tests/release/test-baseline-provenance.test.sh \
            2>&1 | tee ../evidence/baseline-provenance.log
          python3 scripts/render_figures.py "$PWD"
          bash scripts/check_public_claims.sh
          sha256sum --check ../harness/validation/expected-source.sha256
          git diff --check
          python3 - <<'PY'
          import json, pathlib, subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'crates/sysknife-brain/src/prompt.rs',
                      'crates/sysknife-daemon/tests/prompt_risk_labels.rs',
                      'tests/evidence/workspace-tests.json'}
          assert actual == expected, actual
          baseline = json.loads(pathlib.Path('tests/evidence/workspace-tests.json').read_text())
          main = json.loads(pathlib.Path('../evidence/main-measured-baseline.json').read_text())
          assert baseline['tests'] == main['tests'] + 2, (main, baseline)
          assert baseline['frontend_tests'] == main['frontend_tests'], (main, baseline)
          print(json.dumps({'changed_files': sorted(actual), 'generated_baseline': baseline}))
          PY
      - name: Preserve exact generated output and tested patch
        if: always()
        run: |
          mkdir -p ../evidence/generated
          git diff --binary --output=../evidence/measured-source.patch
          git diff --name-only -z | while IFS= read -r -d '' changed; do
            mkdir -p "../evidence/generated/$(dirname "$changed")"
            cp -- "$changed" "../evidence/generated/$changed"
          done
          git status --short > ../evidence/source-status.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: risk-prose-baseline-refresh
          path: evidence/
